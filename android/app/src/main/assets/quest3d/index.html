<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Roadsville Quest</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0b1220;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #f4f7fb; touch-action: none;
    }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 10px 12px; gap: 8px;
    }
    .pill {
      pointer-events: auto;
      background: rgba(8, 14, 24, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: 0.04em;
      backdrop-filter: blur(8px);
    }
    button.pill {
      color: #e8eef8; cursor: pointer;
    }
    .buddy {
      max-width: 78%;
      margin: 0 12px 10px;
      pointer-events: none;
      background: rgba(8, 14, 24, 0.78);
      border: 1px solid rgba(126, 182, 255, 0.35);
      border-radius: 14px 14px 14px 4px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.35;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .buddy.show { opacity: 1; transform: translateY(0); }
    .buddy .who { color: #7eb6ff; font-size: 11px; font-weight: 700; margin-bottom: 4px; }
    .bottom {
      pointer-events: none;
      padding: 0 12px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .choices {
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: auto;
    }
    .choice {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(20, 30, 46, 0.88);
      color: #f4f7fb;
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      line-height: 1.3;
    }
    .choice.good { border-color: #3dd68c; background: rgba(22, 70, 48, 0.9); }
    .choice.bad { border-color: #ff7b72; background: rgba(70, 28, 28, 0.85); }
    .choice:disabled { opacity: 0.95; }
    .hint {
      pointer-events: none;
      text-align: center;
      font-size: 12px;
      color: rgba(244,247,251,0.72);
      margin-bottom: 4px;
    }
    .tap-glow {
      position: absolute; width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #7eb6ff; box-shadow: 0 0 12px #7eb6ff;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 1.2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .35; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
    }
    #menu {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0b1220 0%, #152238 55%, #1a3a2a 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 20px 16px 28px; gap: 10px;
    }
    #menu h1 {
      margin: 0 0 4px; font-size: 28px; letter-spacing: 0.02em;
    }
    #menu p { margin: 0 0 12px; color: rgba(244,247,251,0.78); font-size: 14px; max-width: 28rem; }
    .scenario-btn {
      pointer-events: auto;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      text-align: left;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 15px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .scenario-btn strong { display: block; font-size: 16px; margin-bottom: 2px; }
    .scenario-btn span { opacity: 0.75; font-size: 12px; }
    .scenario-btn:active { transform: scale(0.99); }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Roadsville</h1>
    <p>Lean 3D Quest prototype — tap the world, decide safely. Minimal reading.</p>
    <button class="scenario-btn" data-id="welcome"><strong>1 · Arrival Street</strong><span>Notice what’s alive around you</span></button>
    <button class="scenario-btn" data-id="junction"><strong>2 · Busy Junction</strong><span>One decision. Shared road.</span></button>
    <button class="scenario-btn" data-id="signstop"><strong>3 · Stop Ahead</strong><span>The sign speaks for the road</span></button>
  </div>
  <canvas id="c"></canvas>
  <div id="hud" style="display:none">
    <div class="top-bar">
      <button class="pill" id="btnMap">Map</button>
      <div class="pill" id="sceneLabel">Quest</div>
    </div>
    <div>
      <div class="buddy" id="buddy"><div class="who">Buddy</div><div id="buddyText"></div></div>
      <div class="bottom">
        <div class="hint" id="hint"></div>
        <div class="choices" id="choices"></div>
      </div>
    </div>
  </div>
  <script src="three.min.js"></script>
  <script src="quest.js"></script>
</body>
</html>
