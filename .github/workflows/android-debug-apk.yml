name: Android debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        id: debug-keystore
        with:
          path: android/keystore
          key: rtobuddy-debug-keystore-v1
      - name: Create stable debug keystore
        if: steps.debug-keystore.outputs.cache-hit != 'true'
        working-directory: android
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/rtobuddy-ci-debug.jks \
            -storepass rtobuddyci \
            -keypass rtobuddyci \
            -alias rtobuddyci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RTOBuddy CI Debug, OU=RTOBuddy, O=RTOBuddy, L=Chennai, ST=TN, C=IN"
          printf 'storePassword=rtobuddyci\nkeyPassword=rtobuddyci\nkeyAlias=rtobuddyci\n' > keystore/ci-debug.properties
      - name: Assemble debug APK
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon --no-build-cache --no-configuration-cache 2>&1 | tee gradle-assemble.log
          status=$?
          if [ "$status" -ne 0 ]; then
            excerpt=$(grep -E '^(e: |FAILURE:|\* What went wrong:|> Task .* FAILED)' gradle-assemble.log | tail -n 30)
            echo "$excerpt"
            echo "::error::${excerpt}"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: rtobuddy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gradle-assemble-log
          path: android/gradle-assemble.log
